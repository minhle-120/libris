# Publishing is the only thing in this repository that writes to GitHub, so
# the trigger is the one act that says "this commit is a release": a tag named
# v*. An ordinary `git push` builds nothing and publishes nothing.
#
# No tests run here. They run locally, before the tag is cut — `make check`,
# and `make e2e` / `make ui` where the change reaches that far. What this
# workflow does with a commit is build the UI and compile it for two platforms,
# so the only surprises left here are the ones a single machine cannot produce:
# the Windows leg, and a tag whose UI does not build from clean.
#
# It builds from clean on purpose. web/dist is a build artifact and not a
# source file, so a released asset holds the UI at the tag rather than whatever
# minified bundle someone last remembered to commit.
name: release

on:
  push:
    tags: ['v*']

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    # A Windows `run:` step is PowerShell unless told otherwise, and PowerShell
    # has no notion of $TAG: it built into a file called `libris---` and
    # reported success. Bash on both legs is what makes the command below the
    # same command on both — the whole reason it is one line.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The UI is a build input: web/embed.go embeds web/dist, which is not in
      # git, so the asset does not exist until Vite has run. Node 22 because
      # that is the oldest release Vite 8 supports, and the tag is the version
      # the release page will offer to the world.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build the UI
        run: |
          set -eu
          npm --prefix web ci
          npm --prefix web run build
          # go:embed would fail on its own, but with a pattern error that reads
          # like a missing file rather than a missing build. This says which.
          test -f web/dist/index.html

      # `go build` and not `make`, on both legs: a Windows runner does not
      # promise make on PATH, and one command line that works on either is one
      # less thing that can differ between the two files being published.
      #
      # CGO_ENABLED=0 is what makes the download a download: the link is
      # static, so the binary never asks a stranger's distribution for a glibc
      # it may not have. -s -w drops the symbol and DWARF tables, 22 MB of
      # binary into 14 MB of download.
      - name: build
        env:
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
          OS: ${{ matrix.goos }}
          ARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -eu
          asset="libris-$TAG-$OS-$ARCH$EXT"
          go build -trimpath -ldflags "-s -w" -o "$asset" ./cmd/libris
          test -n "$TAG" && test -f "$asset"
          # A green leg that uploads the wrong filename is worse than a red one:
          # the release page looks finished and the download is named after a
          # shell that expanded nothing. This is the check that catches it.

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: libris-*

  release:
    # One job assembles the release rather than each leg publishing its own
    # file. Two jobs racing to create the same release leaves, when the race is
    # lost, a published release holding one binary.
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: (cd dist && sha256sum libris-* > SHA256SUMS.txt)

      # The tag is the version, and it is the version in the asset names too.
      # Nothing else in the pipeline is told the number, so nothing else can
      # disagree with it — and `libris -version` reports the revision a file
      # was built from, which is what a bug report needs.
      #
      # No release notes, and that is a decision rather than an oversight: a
      # body written once goes stale on the second release nobody remembered to
      # edit. Add --notes-file here if a release ever needs prose.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG"
