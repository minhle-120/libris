name: release

on:
  push:
    tags: ['v*']

# One archive per platform: libris, and the `tools` folder beside it with the
# programs it runs to read a PDF. Unpack and run — see
# docs/adr/0009-the-download-carries-the-programs-it-runs.md.

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            # The PDF tools are gathered inside this image, so its glibc is
            # the oldest one they then start on: a chosen floor rather than
            # whatever the runner image happens to be.
            base: ubuntu:22.04
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
            # Empty means: take the toolchain the runner ships.
            base: ''
    runs-on: ${{ matrix.os }}
    # Bash on both legs, so the build and archive lines below are the same
    # lines on both. PowerShell does not expand $TAG.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/embed.go embeds web/dist, which is not in git: the binary does not
      # contain the UI until Vite has run.
      - name: build the UI
        run: |
          set -eu
          npm --prefix web ci
          npm --prefix web run build
          test -f web/dist/index.html

      # CGO_ENABLED=0 keeps libris itself independent of the machine's C
      # library. The programs it shells out to are the rest of what it needs,
      # and the next two steps are what ship them.
      - name: build
        env:
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
          OS: ${{ matrix.goos }}
          ARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -eu
          asset="libris-$TAG-$OS-$ARCH$EXT"
          go build -trimpath -ldflags "-s -w" -o "$asset" ./cmd/libris
          test -f "$asset"
          mkdir -p stage
          mv "$asset" stage/

      # Nothing else parses these two scripts, and a bad brace costs a whole
      # run of both legs.
      - name: parse the scripts a release runs
        run: |
          set -eu
          for f in scripts/dist/*.sh; do bash -n "$f"; done

      - name: gather the PDF tools (linux)
        if: matrix.base != ''
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -eu
          docker run --rm -v "$PWD":/w "$BASE" \
            bash /w/scripts/dist/tools-linux.sh /w/stage/tools
          test -f stage/tools/pdftotext

      # The runner ships no registered MSYS2 shell any more, so the action
      # installs it, along with the packages the bundle is built from.
      - name: an sh, and poppler
        if: matrix.base == ''
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-poppler-data
            mingw-w64-ucrt-x86_64-fontconfig
            binutils

      - name: gather the PDF tools (windows)
        if: matrix.base == ''
        shell: msys2 {0}
        run: |
          set -eu
          bash scripts/dist/tools-windows.sh stage/tools
          test -f stage/tools/pdftotext.exe

      # The archive is the download. bsdtar is named outright on Windows
      # because the `tar` on a bash PATH there is GNU tar, which will write a
      # plain tar into a file called .zip and report success — so the first
      # two bytes are checked, since the filename cannot prove anything.
      - name: archive
        env:
          TAG: ${{ github.ref_name }}
          OS: ${{ matrix.goos }}
          ARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          if [ "$OS" = windows ]; then
            out="libris-$TAG-windows-$ARCH.zip"
            magic=504b
            tar=/c/Windows/System32/tar.exe
          else
            out="libris-$TAG-linux-$ARCH.tar.gz"
            magic=1f8b
            tar=tar
          fi
          # The folder is what a person unpacks. Packing the staging
          # directory's contents loose buries whatever they extract
          # into under the program, its tools and their libraries.
          dir="libris-$TAG-$OS-$ARCH"
          mv stage "$dir"
          "$tar" -a -cf "$out" "$dir"
          test -s "$out"
          # No `| head` here: the runner's shell runs with pipefail, and tar
          # fails the step with "stdout: write error" the moment head stops
          # reading. The listing is a few hundred lines; take its first here.
          listing=$("$tar" -tf "$out")
          first=${listing%%$'\n'*}
          case "$first" in
            "$dir"/ | "$dir"/*) ;;
            *)
              echo "$out unpacks to loose files, not a folder" >&2
              echo "  first entry: $first" >&2
              exit 1
              ;;
          esac
          got=$(head -c 2 "$out" | od -An -t x1 | tr -d ' \n')
          test "$got" = "$magic" || {
            echo "$out is not a $OS archive" >&2
            exit 1
          }
          mkdir -p out
          mv "$out" out/

      - uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*

  release:
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: (cd dist && sha256sum libris-* > SHA256SUMS.txt)

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # The repo is named because this job checks nothing out, and gh
          # otherwise goes looking for a remote in a .git that is not there.
          # No notes: the archive says what it is by what is in it.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG"
